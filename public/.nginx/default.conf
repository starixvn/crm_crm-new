
server {
    listen 80;
    listen 7519;
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.18.200.131;
    access_log  /var/log/nginx/nexus_crm_public_upload.access.log;
    error_log  /var/log/nginx/nexus_crm_public_upload.error.log;
    root /usr/share/nginx;
    index index.html;
        # issue with ip and the nginx proxy
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp)$ {
            expires 12M;
            access_log off;
            add_header Cache-Control "public";
            types {
                image/jpeg jpg;
                image/jpg jpg;
            }
        }
    location /whoami {
        default_type text/plain;
                    return 200 "SITE: nexus_crm_upload\nSERVER IP: Physical IP - 10.18.200.138 | Container IP - $server_addr\nSERVER FWD IP: $proxy_add_x_forwarded_for\nPUBLIC PORT: 7519\nProxy PORT: 80\nProject Path: ./app/uploads";
                }

}
