
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="./www/dist/css/dev/main.chunk.css" />
</head>
<body>
    <div class="crm-container">
        <div id="app-container" />
    </div>
    <div id="loadingProcess" class="loading-process" style="display: none;">
        <svg class="icon-loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" fill="#439ff0">
            <circle transform="translate(8 0)" cx="0" cy="16" r="0">
                <animate attributeName="r" values="0; 4; 0; 0" dur="1.2s" repeatCount="indefinite" begin="0"
                         keytimes="0;0.2;0.7;1" keySplines="0.2 0.2 0.4 0.8;0.2 0.6 0.4 0.8;0.2 0.6 0.4 0.8" calcMode="spline" />
            </circle>
            <circle transform="translate(16 0)" cx="0" cy="16" r="0">
                <animate attributeName="r" values="0; 4; 0; 0" dur="1.2s" repeatCount="indefinite" begin="0.3"
                         keytimes="0;0.2;0.7;1" keySplines="0.2 0.2 0.4 0.8;0.2 0.6 0.4 0.8;0.2 0.6 0.4 0.8" calcMode="spline" />
            </circle>
            <circle transform="translate(24 0)" cx="0" cy="16" r="0">
                <animate attributeName="r" values="0; 4; 0; 0" dur="1.2s" repeatCount="indefinite" begin="0.6"
                         keytimes="0;0.2;0.7;1" keySplines="0.2 0.2 0.4 0.8;0.2 0.6 0.4 0.8;0.2 0.6 0.4 0.8" calcMode="spline" />
            </circle>
        </svg>
    </div>
    <div hidden id="xsrfToken"></div>
    <div hidden id="currentUsername"></div>
    <div hidden id="currentCustId"></div>
    <div hidden id="currentClientTime"></div>
    <div hidden id="clientTimezone"></div>
    <div hidden id="serverTimezone"></div>
    <input hidden type="checkbox" id="hasCreateFeedbackPermission"></div>

    <script src="./www/dist/js/dev/pages/home/index.chunk.js"></script>
    <script src="./www/dist/js/dev/lib/lang-en-US.chunk.js"></script>
    <script src="./www/dist/js/dev/lib/vendor.chunk.js"></script>
    <script src="./www/dist/js/dev/lib/common.chunk.js"></script>
</body>
</html>
